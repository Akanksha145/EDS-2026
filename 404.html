<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      text-align: center;
    }

    main.error .section {
      width: 100%;
    }

    main.error .error-illustration {
      display: block;
      width: 100%;
      max-width: 420px;
      height: auto;
      margin: 0 auto 24px;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <svg class="error-illustration" viewBox="0 0 400 240" role="img" aria-label="A hiking trail leading to a signpost in the mountains">
        <circle cx="330" cy="50" r="28" fill="var(--link-color)" opacity="0.15"></circle>
        <path d="M0 160 L70 90 L140 160 Z" fill="var(--light-color)"></path>
        <path d="M110 160 L190 70 L270 160 Z" fill="var(--light-color)"></path>
        <path d="M-10 180 L100 100 L180 180 Z" fill="var(--dark-color)" opacity="0.25"></path>
        <path d="M150 180 L260 90 L400 180 Z" fill="var(--dark-color)" opacity="0.25"></path>
        <rect x="0" y="180" width="400" height="60" fill="var(--light-color)"></rect>
        <path d="M40 240 C120 200 160 210 200 190 C240 170 280 178 360 150" stroke="var(--background-color)" stroke-width="14" fill="none" opacity="0.6"></path>
        <g transform="translate(60,150)">
          <rect x="-3" y="30" width="6" height="20" fill="#6b4a2f"></rect>
          <path d="M0 0 L18 34 L-18 34 Z" fill="var(--dark-color)"></path>
          <path d="M0 14 L14 44 L-14 44 Z" fill="var(--dark-color)"></path>
        </g>
        <g transform="translate(230,120)">
          <rect x="-4" y="0" width="8" height="80" fill="#6b4a2f"></rect>
          <g transform="rotate(-6)">
            <rect x="-46" y="-14" width="92" height="28" rx="4" fill="var(--link-color)"></rect>
            <text x="0" y="6" text-anchor="middle" font-family="var(--heading-font-family)" font-size="20" fill="var(--light-color)">404</text>
          </g>
        </g>
      </svg>
      <h2 class="error-message">Looks Like You've Wandered Off the Trail</h2>
      <p>The page you're looking for doesn't exist — let's get you back on track.</p>
      <p class="button-container">
        <a href="/" class="button secondary error-button-home">Go home</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
